name: Aegis CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # --------------------
    # Ubuntu dependencies
    # --------------------
    - name: Install Ubuntu dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        set -e
        sudo apt update
        sudo apt install -y \
          ninja-build \
          patchelf \
          python3-pip \
          libomp5 \
          libomp-dev \
          python3.10-venv

    # --------------------
    # macOS dependencies
    # --------------------
    - name: Install macOS dependencies
      if: startsWith(matrix.os, 'macos')
      run: |
        set -e
        brew update
        brew install \
          ninja \
          cmake \
          protobuf \
          libomp

    # --------------------
    # Python dependencies
    # --------------------
    - name: Install Python requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r frontend/requirements-ci.txt \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          --no-cache-dir

    # --------------------
    # Build wheel
    # --------------------
    - name: Build Aegis wheel
      run: |
        cd scripts
        chmod +x build_wheel.sh
        ./build_wheel.sh

    # --------------------
    # Set PYTHONPATH
    # --------------------
    - name: Set PYTHONPATH for MLIR
      run: |
        echo "PYTHONPATH=/usr/local/lib/python3.10/dist-packages:$PYTHONPATH" >> $GITHUB_ENV

    # --------------------
    # Set runtime library path
    # --------------------
    - name: Set LD_LIBRARY_PATH
      run: |
        echo "LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    # --------------------
    # Install & sanity check
    # --------------------
    - name: Install built wheel
      run: |
        pip install frontend/dist/*.whl

